<!DOCTYPE html>
<html lang="az">
<head>
    <script>(function(){try{var t=localStorage.getItem('lms.theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n-page-title="admin.categoriesTitle">Categories — Learnix</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/pages/home.css">
    <link rel="stylesheet" href="/css/pages/student.css">
    <link rel="stylesheet" href="/css/pages/instructor.css">
    <link rel="stylesheet" href="/css/pages/admin.css">
    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/admin/categories.js"></script>
</head>
<body>
    <a class="skip-link" href="#main" data-i18n="nav.categories">Categories</a>
    <div id="navbar" data-active="categories"></div>

    <div class="container page">
        <div class="layout-with-sidebar">
            <aside id="sidebar" data-active="categories"></aside>

            <main id="main">
                <header class="section-head">
                    <div>
                        <h1 data-i18n="admin.categoriesTitle">Categories</h1>
                        <p class="text-muted" data-i18n="admin.categoriesSubtitle"></p>
                    </div>
                    <button id="add-category" type="button" class="btn btn-primary" data-i18n="admin.addCategory"></button>
                </header>

                <div id="categories-content"></div>
            </main>
        </div>
    </div>
</body>
</html>
