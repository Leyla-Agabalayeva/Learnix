<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n-page-title="admin.coursesTitle">Courses — Learnix</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/pages/home.css">
    <link rel="stylesheet" href="/css/pages/student.css">
    <link rel="stylesheet" href="/css/pages/instructor.css">
    <link rel="stylesheet" href="/css/pages/admin.css">
    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/admin/courses.js"></script>
</head>
<body>
    <a class="skip-link" href="#main" data-i18n="nav.courses">Courses</a>
    <div id="navbar" data-active="admin-courses"></div>

    <div class="container page">
        <div class="layout-with-sidebar">
            <aside id="sidebar" data-active="courses"></aside>

            <main id="main">
                <header class="section-head">
                    <div>
                        <h1 data-i18n="admin.coursesTitle">Courses</h1>
                        <p class="text-muted" data-i18n="admin.coursesSubtitle"></p>
                    </div>
                </header>

                <div class="admin-toolbar">
                    <input id="search" class="input" type="search" data-i18n-placeholder="admin.searchCourses">
                    <select id="status-filter" class="select"></select>
                </div>

                <div id="courses-content"></div>
                <div id="pagination"></div>
            </main>
        </div>
    </div>
</body>
</html>
