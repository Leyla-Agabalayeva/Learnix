<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n-page-title="nav.courses">Course — Learnix</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/pages/home.css">
    <link rel="stylesheet" href="/css/pages/course-details.css">
    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/course-details.js"></script>
</head>
<body>
    <a class="skip-link" href="#main" data-i18n="nav.courses">Kurslar</a>
    <div id="navbar" data-active="courses"></div>

    <!-- Пока курс грузится — спиннер; при ошибке 404 сюда встаёт пустое состояние. -->
    <div id="page-state"></div>

    <main id="main" class="hidden">
        <!-- ========================= Шапка ========================= -->
        <section class="course-hero">
            <div class="container course-hero-inner">
                <div>
                    <nav class="course-breadcrumb" aria-label="Naviqasiya" data-i18n-aria-label="details.breadcrumb">
                        <a href="/pages/courses.html" data-i18n="details.backToCatalogue">Kataloqa qayıt</a>
                        <span aria-hidden="true">›</span>
                        <span id="course-category"></span>
                    </nav>

                    <div class="flex gap-2 flex-wrap mb-4">
                        <span class="badge badge-primary" id="course-level"></span>
                        <span class="badge badge-success hidden" id="enrolled-badge"
                              data-i18n="details.enrolledBadge">Siz qoşulmusunuz</span>
                    </div>

                    <h1 class="course-title" id="course-title">—</h1>
                    <p class="course-tagline" id="course-tagline"></p>

                    <div class="course-meta">
                        <span class="course-meta-item" id="meta-rating"></span>
                        <span class="course-meta-item" id="meta-students"></span>
                        <span class="course-meta-item" id="meta-duration"></span>
                        <span class="course-meta-item" id="meta-instructor"></span>
                    </div>
                </div>

                <!-- ==================== Панель записи ==================== -->
                <aside class="enroll-card">
                    <div class="enroll-card-thumb" id="course-thumb"></div>
                    <div class="enroll-card-body">
                        <p class="enroll-price" id="course-price">—</p>

                        <!-- Кнопку собирает JS: «Записаться», «Продолжить обучение»
                             или «Войдите, чтобы записаться» — зависит от ответа сервера. -->
                        <div id="enroll-action" class="mt-5"></div>

                        <dl class="enroll-facts">
                            <div class="enroll-fact">
                                <dt data-i18n="course.lessons">Dərslər</dt>
                                <dd id="fact-lessons">—</dd>
                            </div>
                            <div class="enroll-fact">
                                <dt data-i18n="course.modules">Modullar</dt>
                                <dd id="fact-modules">—</dd>
                            </div>
                            <div class="enroll-fact">
                                <dt data-i18n="course.duration">Müddət</dt>
                                <dd id="fact-duration">—</dd>
                            </div>
                            <div class="enroll-fact">
                                <dt data-i18n="course.level">Səviyyə</dt>
                                <dd id="fact-level">—</dd>
                            </div>
                        </dl>
                    </div>
                </aside>
            </div>
        </section>

        <!-- ======================= Содержимое ======================= -->
        <div class="container course-body">
            <div>
                <section class="course-section" id="learn-section">
                    <h2 class="course-section-title" data-i18n="details.whatYouWillLearn">Nə öyrənəcəksiniz</h2>
                    <ul class="learn-list" id="learn-list"></ul>
                </section>

                <section class="course-section">
                    <h2 class="course-section-title" data-i18n="details.aboutCourse">Kurs haqqında</h2>
                    <p class="course-description" id="course-description"></p>
                </section>

                <section class="course-section">
                    <h2 class="course-section-title" data-i18n="details.curriculum">Kurs proqramı</h2>
                    <p class="curriculum-summary-line" id="curriculum-summary"></p>
                    <div class="curriculum" id="curriculum"></div>
                </section>

                <section class="course-section">
                    <h2 class="course-section-title" data-i18n="details.reviews">Tələbə rəyləri</h2>
                    <div id="rating-overview"></div>
                    <div id="review-form-container"></div>
                    <div id="reviews"></div>
                </section>
            </div>

            <div><!-- вторая колонка занята липкой панелью записи из шапки --></div>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <p>© 2026 <span data-i18n="app.name">Learnix</span></p>
        </div>
    </footer>
</body>
</html>
