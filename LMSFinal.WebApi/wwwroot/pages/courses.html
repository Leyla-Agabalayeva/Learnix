<!DOCTYPE html>
<html lang="az">
<head>
    <script>(function(){try{var t=localStorage.getItem('lms.theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n-page-title="catalog.title">Courses — Learnix</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/pages/home.css">
    <link rel="stylesheet" href="/css/pages/catalog.css">
    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/courses.js"></script>
</head>
<body>
    <a class="skip-link" href="#main" data-i18n="nav.courses">Kurslar</a>
    <div id="navbar" data-active="courses"></div>

    <main id="main" class="container page">
        <header class="page-header">
            <div>
                <h1 class="page-title" data-i18n="catalog.title">Kurs kataloqu</h1>
                <p class="page-subtitle" data-i18n="catalog.subtitle"></p>
            </div>
        </header>

        <div class="catalog-layout">
            <!-- ===================== Фильтры ===================== -->
            <aside class="filters">
                <div class="filters-head">
                    <span class="filters-title" data-i18n="catalog.filters">Filtrlər</span>
                    <button class="btn btn-ghost btn-sm" type="button" id="clear-filters"
                            data-i18n="actions.clearFilters">Sıfırla</button>
                </div>

                <button class="btn btn-secondary btn-block filters-toggle mb-4" type="button"
                        id="filters-toggle" aria-expanded="false" aria-controls="filters-body">
                    <span data-i18n="catalog.filters">Filtrlər</span>
                </button>

                <div class="filters-body" id="filters-body">
                    <fieldset class="filter-group">
                        <legend class="filter-legend" data-i18n="catalog.category">Kateqoriya</legend>
                        <div id="category-filters">
                            <label class="filter-option">
                                <input type="radio" name="categoryId" value="" checked>
                                <span data-i18n="catalog.allCategories">Bütün kateqoriyalar</span>
                            </label>
                        </div>
                    </fieldset>

                    <fieldset class="filter-group">
                        <legend class="filter-legend" data-i18n="catalog.level">Səviyyə</legend>
                        <label class="filter-option">
                            <input type="radio" name="level" value="" checked>
                            <span data-i18n="catalog.allLevels">Bütün səviyyələr</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="level" value="Beginner">
                            <span data-i18n="course.levelBeginner">Başlanğıc</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="level" value="Intermediate">
                            <span data-i18n="course.levelIntermediate">Orta</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="level" value="Advanced">
                            <span data-i18n="course.levelAdvanced">Qabaqcıl</span>
                        </label>
                    </fieldset>

                    <fieldset class="filter-group">
                        <legend class="filter-legend" data-i18n="catalog.price">Qiymət</legend>
                        <label class="filter-option">
                            <input type="radio" name="price" value="" checked>
                            <span data-i18n="catalog.allPrices">İstənilən qiymət</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="price" value="free">
                            <span data-i18n="catalog.priceFree">Yalnız pulsuz</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="price" value="paid">
                            <span data-i18n="catalog.pricePaid">Yalnız ödənişli</span>
                        </label>
                    </fieldset>
                </div>
            </aside>

            <!-- ===================== Результаты ===================== -->
            <section>
                <div class="catalog-toolbar">
                    <div class="search-box">
                        <span class="search-box-icon" aria-hidden="true">🔍</span>
                        <label class="sr-only" for="search" data-i18n="actions.search">Axtar</label>
                        <input class="input" id="search" type="search"
                               data-i18n-placeholder="catalog.searchPlaceholder">
                        <span class="search-box-spinner hidden" id="search-spinner">
                            <span class="spinner spinner-sm"></span>
                        </span>
                    </div>

                    <label class="sr-only" for="sort" data-i18n="catalog.sort">Sıralama</label>
                    <select class="select sort-select" id="sort">
                        <option value="Newest" data-i18n="catalog.sortNewest">Əvvəlcə yeni</option>
                        <option value="Popular" data-i18n="catalog.sortPopular">Ən populyar</option>
                        <option value="Rating" data-i18n="catalog.sortRating">Reytinqə görə</option>
                        <option value="PriceAsc" data-i18n="catalog.sortPriceAsc">Əvvəlcə ucuz</option>
                        <option value="PriceDesc" data-i18n="catalog.sortPriceDesc">Əvvəlcə bahalı</option>
                    </select>
                </div>

                <div class="active-filters" id="active-filters"></div>

                <!-- aria-live: скринридер сообщит, сколько курсов нашлось, после каждого
                     изменения фильтров — иначе смена выдачи остаётся незамеченной. -->
                <!-- Заголовок скрыт визуально, но нужен структурно: без него
                     после h1 «Каталог курсов» сразу шли h3 названий курсов —
                     скринридер видел пропуск уровня и терял вложенность. -->
                <h2 class="sr-only" data-i18n="catalog.resultsHeading">Axtarış nəticələri</h2>

                <p class="catalog-summary" id="results-summary" role="status" aria-live="polite"></p>

                <div class="grid-cards" id="course-grid"></div>

                <div id="pagination"></div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <p>© 2026 <span data-i18n="app.name">Learnix</span></p>
        </div>
    </footer>
</body>
</html>
