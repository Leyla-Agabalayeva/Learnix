<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n-page-title="auth.forgotPasswordTitle">Forgot password — Learnix</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/pages/auth.css">
    <script type="module" src="/js/pages/forgot-password.js"></script>
</head>
<body>
    <div class="auth-layout">
        <section class="auth-form-side">
            <div class="auth-box">
                <div class="auth-head">
                    <a class="auth-brand" href="/">
                        <span class="navbar-logo" aria-hidden="true">L</span>
                        <span data-i18n="app.name">Learnix</span>
                    </a>

                    <div id="language-switcher"></div>
                </div>

                <h1 class="auth-title" data-i18n="auth.forgotPasswordTitle">Forgot password?</h1>
                <p class="auth-subtitle" data-i18n="auth.forgotPasswordSubtitle"></p>

                <div class="auth-alert" id="form-error" role="alert"></div>

                <!-- После отправки форма заменяется этим сообщением — незачем
                     держать поле email на экране, когда просить больше нечего. -->
                <div class="auth-alert auth-alert-success hidden" id="form-success" role="status"></div>

                <form id="forgot-password-form" novalidate>
                    <div class="field">
                        <label class="field-label" for="email" data-i18n="auth.email">Email</label>
                        <input class="input" id="email" name="email" type="email"
                               autocomplete="email" required
                               aria-describedby="email-error">
                        <p class="field-error hidden" id="email-error"></p>
                    </div>

                    <button class="btn btn-primary btn-block btn-lg mt-2" type="submit" id="submit"
                            data-i18n="auth.sendResetLink">Send reset link</button>
                </form>

                <p class="auth-footer">
                    <a href="/pages/login.html" data-i18n="auth.backToLogin">Back to login</a>
                </p>
            </div>
        </section>

        <aside class="auth-info-side">
            <h2 class="auth-info-title" data-i18n="auth.sidePanelTitle">Everything in one place</h2>
            <ul class="auth-info-list">
                <li class="auth-info-item">
                    <span class="auth-info-check" aria-hidden="true">✓</span>
                    <span data-i18n="auth.sidePanelPoint1"></span>
                </li>
                <li class="auth-info-item">
                    <span class="auth-info-check" aria-hidden="true">✓</span>
                    <span data-i18n="auth.sidePanelPoint2"></span>
                </li>
                <li class="auth-info-item">
                    <span class="auth-info-check" aria-hidden="true">✓</span>
                    <span data-i18n="auth.sidePanelPoint3"></span>
                </li>
            </ul>
        </aside>
    </div>
</body>
</html>
