<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n-page-title="nav.dashboard">Instructor Dashboard — Learnix</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/pages/home.css">
    <link rel="stylesheet" href="/css/pages/student.css">
    <link rel="stylesheet" href="/css/pages/instructor.css">
    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/instructor/dashboard.js"></script>
</head>
<body>
    <a class="skip-link" href="#main" data-i18n="nav.dashboard">Panel</a>
    <div id="navbar" data-active="dashboard"></div>

    <div class="container page">
        <div class="layout-with-sidebar">
            <aside id="sidebar" data-active="dashboard"></aside>

            <main id="main">
                <header class="dashboard-greeting">
                    <h1 id="greeting">—</h1>
                    <p class="text-muted" data-i18n="instructor.welcomeHint"></p>
                </header>

                <section class="grid-stats mb-8" id="stats"></section>

                <section>
                    <div class="section-head">
                        <h2 class="section-title" data-i18n="instructor.myCoursesTitle">Kurslarım</h2>
                        <div class="flex gap-2">
                            <a class="btn btn-secondary btn-sm" href="/pages/instructor/courses.html"
                               data-i18n="actions.viewAll">Hamısına bax</a>
                            <a class="btn btn-primary btn-sm" href="/pages/instructor/create-course.html"
                               data-i18n="nav.createCourse">Kurs yarat</a>
                        </div>
                    </div>
                    <div class="grid-cards" id="recent-courses"></div>
                </section>
            </main>
        </div>
    </div>
</body>
</html>
