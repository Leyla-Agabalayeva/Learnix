<!DOCTYPE html>
<html lang="az">
<head>
    <script>(function(){try{var t=localStorage.getItem('lms.theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n-page-title="nav.profile">Profile — Learnix</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/pages/home.css">
    <link rel="stylesheet" href="/css/pages/student.css">
    <link rel="stylesheet" href="/css/pages/instructor.css">
    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/instructor/profile.js"></script>
</head>
<body>
    <a class="skip-link" href="#main" data-i18n="nav.dashboard">Panel</a>
    <div id="navbar" data-active=""></div>

    <div class="container page">
        <div class="layout-with-sidebar">
            <aside id="sidebar" data-active="profile"></aside>

            <main id="main">
                <header class="page-header">
                    <div>
                        <h1 class="page-title" data-i18n="instructor.profileTitle">Profil</h1>
                        <p class="page-subtitle" data-i18n="instructor.profileSubtitle"></p>
                    </div>
                </header>

                <div class="profile-head">
                    <button type="button" class="profile-avatar" id="profile-avatar" aria-label="Изменить фото"></button>
                    <div>
                        <p class="text-lg font-semibold" id="profile-name">—</p>
                        <p class="text-sm text-muted" id="profile-email"></p>
                        <p class="text-sm text-muted mt-2" id="profile-meta"></p>
                    </div>
                </div>

                <div class="card profile-form">
                    <div class="card-body">
                        <div class="auth-alert" id="form-error" role="alert"></div>

                        <form id="profile-form" novalidate>
                            <div class="flex gap-3">
                                <div class="field w-full">
                                    <label class="field-label" for="firstName"
                                           data-i18n="auth.firstName">Ad</label>
                                    <input class="input" id="firstName" name="firstName" type="text"
                                           required aria-describedby="firstName-error">
                                    <p class="field-error hidden" id="firstName-error"></p>
                                </div>
                                <div class="field w-full">
                                    <label class="field-label" for="lastName"
                                           data-i18n="auth.lastName">Soyad</label>
                                    <input class="input" id="lastName" name="lastName" type="text"
                                           required aria-describedby="lastName-error">
                                    <p class="field-error hidden" id="lastName-error"></p>
                                </div>
                            </div>

                            <!-- Для преподавателя био — не украшение: оно видно студентам
                                 на странице курса рядом с его именем. -->
                            <div class="field">
                                <label class="field-label" for="bio" data-i18n="student.bio">Haqqınızda</label>
                                <textarea class="textarea" id="bio" name="bio"
                                          data-i18n-placeholder="student.bioPlaceholder"
                                          aria-describedby="bio-error"></textarea>
                                <p class="field-error hidden" id="bio-error"></p>
                            </div>

                            <!-- Профессиональный профиль, собранный при регистрации: без этих
                                 полей в форме сохранение стёрло бы их (PUT заменяет профиль целиком). -->
                            <div class="flex gap-3">
                                <div class="field w-full">
                                    <label class="field-label" for="professionalTitle" data-i18n="auth.instructor.title">Vəzifə</label>
                                    <input class="input" id="professionalTitle" name="professionalTitle" type="text" maxlength="150"
                                           data-i18n-placeholder="auth.instructor.titlePlaceholder"
                                           aria-describedby="professionalTitle-error">
                                    <p class="field-error hidden" id="professionalTitle-error"></p>
                                </div>
                                <div class="field w-full">
                                    <label class="field-label" for="specialization" data-i18n="auth.instructor.specialization">İxtisas</label>
                                    <input class="input" id="specialization" name="specialization" type="text" maxlength="150"
                                           data-i18n-placeholder="auth.instructor.specializationPlaceholder"
                                           aria-describedby="specialization-error">
                                    <p class="field-error hidden" id="specialization-error"></p>
                                </div>
                            </div>

                            <div class="flex gap-3">
                                <div class="field w-full">
                                    <label class="field-label" for="yearsOfExperience" data-i18n="auth.instructor.experience">İş stajı (il)</label>
                                    <input class="input" id="yearsOfExperience" name="yearsOfExperience" type="number"
                                           min="0" max="60" inputmode="numeric" aria-describedby="yearsOfExperience-error">
                                    <p class="field-error hidden" id="yearsOfExperience-error"></p>
                                </div>
                                <div class="field w-full">
                                    <label class="field-label" for="educationLevel" data-i18n="auth.instructor.education">Təhsil</label>
                                    <select class="select" id="educationLevel" name="educationLevel" aria-describedby="educationLevel-error">
                                        <option value="" data-i18n="auth.instructor.educationNone">Seçin</option>
                                        <option value="HighSchool" data-i18n="auth.instructor.eduHighSchool">Orta təhsil</option>
                                        <option value="Bachelor" data-i18n="auth.instructor.eduBachelor">Bakalavr</option>
                                        <option value="Master" data-i18n="auth.instructor.eduMaster">Magistr</option>
                                        <option value="Doctorate" data-i18n="auth.instructor.eduDoctorate">Doktorantura</option>
                                        <option value="Other" data-i18n="auth.instructor.eduOther">Digər</option>
                                    </select>
                                    <p class="field-error hidden" id="educationLevel-error"></p>
                                </div>
                            </div>

                            <div class="field">
                                <label class="field-label" for="organization" data-i18n="auth.instructor.organization">İş yeri</label>
                                <input class="input" id="organization" name="organization" type="text" maxlength="150"
                                       aria-describedby="organization-error">
                                <p class="field-error hidden" id="organization-error"></p>
                            </div>

                            <div class="field">
                                <label class="field-label" for="profileUrl" data-i18n="auth.instructor.profileUrl">LinkedIn</label>
                                <input class="input" id="profileUrl" name="profileUrl" type="url" maxlength="500"
                                       placeholder="https://" aria-describedby="profileUrl-error">
                                <p class="field-error hidden" id="profileUrl-error"></p>
                            </div>

                            <div class="field">
                                <label class="field-label" for="email" data-i18n="auth.email">E-poçt</label>
                                <input class="input" id="email" type="email" disabled>
                                <p class="field-hint" data-i18n="student.emailLocked"></p>
                            </div>

                            <button class="btn btn-primary mt-2" type="submit" id="submit"
                                    data-i18n="actions.saveChanges">Yadda saxla</button>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
