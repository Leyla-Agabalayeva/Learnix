<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n-page-title="auth.login">Login — Learnix</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/pages/auth.css">
    <script type="module" src="/js/pages/login.js"></script>
</head>
<body>
    <div class="auth-layout">
        <!-- ===================== Форма ===================== -->
        <section class="auth-form-side">
            <div class="auth-box">
                <!-- Логотип и переключатель языка в одной строке: навбара на этой
                     странице нет, а сменить язык до входа нужно уметь. -->
                <div class="auth-head">
                    <a class="auth-brand" href="/">
                        <span class="navbar-logo" aria-hidden="true">L</span>
                        <span data-i18n="app.name">Learnix</span>
                    </a>

                    <!-- Собирается в js/components/language-switcher.js -->
                    <div id="language-switcher"></div>
                </div>

                <h1 class="auth-title" data-i18n="auth.loginTitle">Yenidən xoş gəldiniz</h1>
                <p class="auth-subtitle" data-i18n="auth.loginSubtitle"></p>

                <!-- Общая ошибка: «Неверный email или пароль». Ошибки конкретных
                     полей показываются под самими полями. -->
                <div class="auth-alert" id="form-error" role="alert"></div>

                <form id="login-form" novalidate>
                    <div class="field">
                        <label class="field-label" for="email" data-i18n="auth.email">E-poçt</label>
                        <input class="input" id="email" name="email" type="email"
                               autocomplete="email" required
                               aria-describedby="email-error">
                        <p class="field-error hidden" id="email-error"></p>
                    </div>

                    <div class="field">
                        <div class="flex justify-between items-center">
                            <label class="field-label" for="password" data-i18n="auth.password">Şifrə</label>
                            <a class="text-sm" href="/pages/forgot-password.html" data-i18n="auth.forgotPassword">Forgot password?</a>
                        </div>
                        <input class="input" id="password" name="password" type="password"
                               autocomplete="current-password" required
                               aria-describedby="password-error">
                        <p class="field-error hidden" id="password-error"></p>
                    </div>

                    <button class="btn btn-primary btn-block btn-lg mt-2" type="submit" id="submit"
                            data-i18n="auth.login">Daxil ol</button>
                </form>

                <p class="auth-footer">
                    <span data-i18n="auth.noAccount">Hesabınız yoxdur?</span>
                    <a href="/pages/register.html" data-i18n="auth.register">Qeydiyyat</a>
                </p>

                <!-- Демо-аккаунты: на защите заполняют форму в один клик. -->
                <div class="demo-accounts">
                    <p class="demo-accounts-title" data-i18n="auth.demoTitle">Demo hesablar</p>
                    <p class="text-xs text-muted" data-i18n="auth.demoHint"></p>

                    <button class="demo-account" type="button"
                            data-email="student@lms.com" data-password="Demo123!">
                        <span><strong data-i18n="auth.roleStudent">Tələbə</strong> — student@lms.com</span>
                        <code>Demo123!</code>
                    </button>

                    <button class="demo-account" type="button"
                            data-email="instructor@lms.com" data-password="Demo123!">
                        <span><strong data-i18n="auth.roleInstructor">Müəllim</strong> — instructor@lms.com</span>
                        <code>Demo123!</code>
                    </button>

                    <button class="demo-account" type="button"
                            data-email="admin@lms.com" data-password="Admin123!">
                        <span><strong data-i18n="auth.roleAdmin">Administrator</strong> — admin@lms.com</span>
                        <code>Admin123!</code>
                    </button>
                </div>

                <p class="auth-footer">
                    <a href="/" data-i18n="auth.backToSite">Sayta qayıt</a>
                </p>
            </div>
        </section>

        <!-- ================= Смысловая панель ================= -->
        <aside class="auth-info-side">
            <h2 class="auth-info-title" data-i18n="auth.sidePanelTitle">Hamısı bir yerdə</h2>
            <ul class="auth-info-list">
                <li class="auth-info-item">
                    <span class="auth-info-check" aria-hidden="true">✓</span>
                    <span data-i18n="auth.sidePanelPoint1"></span>
                </li>
                <li class="auth-info-item">
                    <span class="auth-info-check" aria-hidden="true">✓</span>
                    <span data-i18n="auth.sidePanelPoint2"></span>
                </li>
                <li class="auth-info-item">
                    <span class="auth-info-check" aria-hidden="true">✓</span>
                    <span data-i18n="auth.sidePanelPoint3"></span>
                </li>
            </ul>
        </aside>
    </div>
</body>
</html>
