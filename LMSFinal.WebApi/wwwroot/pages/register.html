<!DOCTYPE html>
<html lang="az">
<head>
    <script>(function(){try{var t=localStorage.getItem('lms.theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n-page-title="auth.register">Sign Up — Learnix</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/pages/auth.css">
    <script type="module" src="/js/pages/register.js"></script>
</head>
<body>
    <div class="auth-layout">
        <section class="auth-form-side">
            <div class="auth-box">
                <!-- Логотип и переключатель языка в одной строке: навбара на этой
                     странице нет, а сменить язык до входа нужно уметь. -->
                <div class="auth-head">
                    <a class="auth-brand" href="/">
                        <span class="navbar-logo" aria-hidden="true">L</span>
                        <span data-i18n="app.name">Learnix</span>
                    </a>

                    <!-- Собирается в js/components/language-switcher.js -->
                    <div id="language-switcher"></div>
                </div>

                <h1 class="auth-title" data-i18n="auth.registerTitle">Hesab yaradın</h1>
                <p class="auth-subtitle" data-i18n="auth.registerSubtitle"></p>

                <div class="auth-alert" id="form-error" role="alert"></div>

                <form id="register-form" novalidate>
                    <!-- Роль первой: она определяет весь дальнейший опыт в системе. -->
                    <div class="field">
                        <span class="field-label" id="role-label" data-i18n="auth.role">Rol</span>
                        <div class="role-options" role="radiogroup" aria-labelledby="role-label">
                            <label class="role-option">
                                <input type="radio" name="role" value="Student" checked>
                                <span class="role-option-title" data-i18n="auth.roleStudent">Tələbə</span>
                                <span class="role-option-hint" data-i18n="auth.roleStudentHint"></span>
                            </label>
                            <label class="role-option">
                                <input type="radio" name="role" value="Instructor">
                                <span class="role-option-title" data-i18n="auth.roleInstructor">Müəllim</span>
                                <span class="role-option-hint" data-i18n="auth.roleInstructorHint"></span>
                            </label>
                        </div>
                    </div>

                    <div class="flex gap-3">
                        <div class="field w-full">
                            <label class="field-label" for="firstName" data-i18n="auth.firstName">Ad</label>
                            <input class="input" id="firstName" name="firstName" type="text"
                                   autocomplete="given-name" required aria-describedby="firstName-error">
                            <p class="field-error hidden" id="firstName-error"></p>
                        </div>

                        <div class="field w-full">
                            <label class="field-label" for="lastName" data-i18n="auth.lastName">Soyad</label>
                            <input class="input" id="lastName" name="lastName" type="text"
                                   autocomplete="family-name" required aria-describedby="lastName-error">
                            <p class="field-error hidden" id="lastName-error"></p>
                        </div>
                    </div>

                    <div class="field">
                        <label class="field-label" for="email" data-i18n="auth.email">E-poçt</label>
                        <input class="input" id="email" name="email" type="email"
                               autocomplete="email" required aria-describedby="email-error">
                        <p class="field-error hidden" id="email-error"></p>
                    </div>

                    <div class="field">
                        <label class="field-label" for="password" data-i18n="auth.password">Şifrə</label>
                        <input class="input" id="password" name="password" type="password"
                               autocomplete="new-password" minlength="8" required
                               aria-describedby="password-hint password-error">
                        <p class="field-hint" id="password-hint" data-i18n="auth.passwordHint"></p>
                        <p class="field-error hidden" id="password-error"></p>
                    </div>

                    <!-- Профессиональный профиль: показывается только преподавателю.
                         Имена полей совпадают с ключами ответа API (camelCase), чтобы
                         form-errors.js мог разложить серверные ошибки по полям. -->
                    <fieldset class="auth-section hidden" id="instructor-fields" disabled>
                        <legend class="auth-section-title" data-i18n="auth.instructor.sectionTitle">Peşəkar profil</legend>
                        <p class="auth-section-hint" data-i18n="auth.instructor.sectionHint"></p>

                        <div class="flex gap-3">
                            <div class="field w-full">
                                <label class="field-label" for="professionalTitle" data-i18n="auth.instructor.title">Vəzifə</label>
                                <input class="input" id="professionalTitle" name="professionalTitle" type="text" maxlength="150"
                                       autocomplete="organization-title" aria-describedby="professionalTitle-error"
                                       data-i18n-placeholder="auth.instructor.titlePlaceholder">
                                <p class="field-error hidden" id="professionalTitle-error"></p>
                            </div>

                            <div class="field w-full">
                                <label class="field-label" for="specialization" data-i18n="auth.instructor.specialization">İxtisas</label>
                                <input class="input" id="specialization" name="specialization" type="text" maxlength="150"
                                       aria-describedby="specialization-error"
                                       data-i18n-placeholder="auth.instructor.specializationPlaceholder">
                                <p class="field-error hidden" id="specialization-error"></p>
                            </div>
                        </div>

                        <div class="flex gap-3">
                            <div class="field w-full">
                                <label class="field-label" for="yearsOfExperience" data-i18n="auth.instructor.experience">İş stajı (il)</label>
                                <input class="input" id="yearsOfExperience" name="yearsOfExperience" type="number"
                                       min="0" max="60" inputmode="numeric" aria-describedby="yearsOfExperience-error">
                                <p class="field-error hidden" id="yearsOfExperience-error"></p>
                            </div>

                            <div class="field w-full">
                                <label class="field-label" for="educationLevel" data-i18n="auth.instructor.education">Təhsil</label>
                                <select class="select" id="educationLevel" name="educationLevel" aria-describedby="educationLevel-error">
                                    <option value="" data-i18n="auth.instructor.educationNone">Seçin</option>
                                    <option value="HighSchool" data-i18n="auth.instructor.eduHighSchool">Orta təhsil</option>
                                    <option value="Bachelor" data-i18n="auth.instructor.eduBachelor">Bakalavr</option>
                                    <option value="Master" data-i18n="auth.instructor.eduMaster">Magistr</option>
                                    <option value="Doctorate" data-i18n="auth.instructor.eduDoctorate">Doktorantura</option>
                                    <option value="Other" data-i18n="auth.instructor.eduOther">Digər</option>
                                </select>
                                <p class="field-error hidden" id="educationLevel-error"></p>
                            </div>
                        </div>

                        <div class="field">
                            <label class="field-label" for="organization">
                                <span data-i18n="auth.instructor.organization">İş yeri</span>
                                <span class="field-optional" data-i18n="auth.instructor.optional">(könüllü)</span>
                            </label>
                            <input class="input" id="organization" name="organization" type="text" maxlength="150"
                                   autocomplete="organization" aria-describedby="organization-error">
                            <p class="field-error hidden" id="organization-error"></p>
                        </div>

                        <div class="field">
                            <label class="field-label" for="bio" data-i18n="auth.instructor.bio">Özünüz haqqında</label>
                            <textarea class="textarea" id="bio" name="bio" rows="4" maxlength="1000"
                                      aria-describedby="bio-hint bio-error"
                                      data-i18n-placeholder="auth.instructor.bioPlaceholder"></textarea>
                            <p class="field-hint" id="bio-hint"><span id="bio-count">0</span> / 1000 · <span data-i18n="auth.instructor.bioHint"></span></p>
                            <p class="field-error hidden" id="bio-error"></p>
                        </div>

                        <div class="field">
                            <label class="field-label" for="profileUrl">
                                <span data-i18n="auth.instructor.profileUrl">LinkedIn və ya sayt</span>
                                <span class="field-optional" data-i18n="auth.instructor.optional">(könüllü)</span>
                            </label>
                            <input class="input" id="profileUrl" name="profileUrl" type="url" maxlength="500"
                                   placeholder="https://" aria-describedby="profileUrl-error">
                            <p class="field-error hidden" id="profileUrl-error"></p>
                        </div>
                    </fieldset>

                    <button class="btn btn-primary btn-block btn-lg mt-2" type="submit" id="submit"
                            data-i18n="actions.createAccount">Hesab yarat</button>
                </form>

                <p class="auth-footer">
                    <span data-i18n="auth.hasAccount">Artıq hesabınız var?</span>
                    <a href="/pages/login.html" data-i18n="auth.login">Daxil ol</a>
                </p>

                <p class="auth-footer">
                    <a href="/" data-i18n="auth.backToSite">Sayta qayıt</a>
                </p>
            </div>
        </section>

        <aside class="auth-info-side">
            <h2 class="auth-info-title" data-i18n="auth.sidePanelTitle">Hamısı bir yerdə</h2>
            <ul class="auth-info-list">
                <li class="auth-info-item">
                    <span class="auth-info-check" aria-hidden="true">✓</span>
                    <span data-i18n="auth.sidePanelPoint1"></span>
                </li>
                <li class="auth-info-item">
                    <span class="auth-info-check" aria-hidden="true">✓</span>
                    <span data-i18n="auth.sidePanelPoint2"></span>
                </li>
                <li class="auth-info-item">
                    <span class="auth-info-check" aria-hidden="true">✓</span>
                    <span data-i18n="auth.sidePanelPoint3"></span>
                </li>
            </ul>
        </aside>
    </div>
</body>
</html>
