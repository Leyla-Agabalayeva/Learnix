<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n-page-title="auth.resetPasswordTitle">Reset password — Learnix</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/pages/auth.css">
    <script type="module" src="/js/pages/reset-password.js"></script>
</head>
<body>
    <div class="auth-layout">
        <section class="auth-form-side">
            <div class="auth-box">
                <div class="auth-head">
                    <a class="auth-brand" href="/">
                        <span class="navbar-logo" aria-hidden="true">L</span>
                        <span data-i18n="app.name">Learnix</span>
                    </a>

                    <div id="language-switcher"></div>
                </div>

                <h1 class="auth-title" data-i18n="auth.resetPasswordTitle">Set a new password</h1>
                <p class="auth-subtitle" data-i18n="auth.resetPasswordSubtitle"></p>

                <div class="auth-alert" id="form-error" role="alert"></div>
                <div class="auth-alert auth-alert-success hidden" id="form-success" role="status"></div>

                <form id="reset-password-form" novalidate>
                    <div class="field">
                        <label class="field-label" for="password" data-i18n="auth.newPassword">New password</label>
                        <input class="input" id="password" name="password" type="password"
                               autocomplete="new-password" required
                               aria-describedby="password-error password-hint">
                        <p class="field-hint" data-i18n="auth.passwordHint"></p>
                        <p class="field-error hidden" id="password-error"></p>
                    </div>

                    <div class="field">
                        <label class="field-label" for="confirmPassword"
                               data-i18n="auth.confirmPassword">Confirm password</label>
                        <input class="input" id="confirmPassword" name="confirmPassword" type="password"
                               autocomplete="new-password" required
                               aria-describedby="confirmPassword-error">
                        <p class="field-error hidden" id="confirmPassword-error"></p>
                    </div>

                    <button class="btn btn-primary btn-block btn-lg mt-2" type="submit" id="submit"
                            data-i18n="auth.resetPasswordSubmit">Set new password</button>
                </form>

                <p class="auth-footer">
                    <a href="/pages/login.html" data-i18n="auth.backToLogin">Back to login</a>
                </p>
            </div>
        </section>

        <aside class="auth-info-side">
            <h2 class="auth-info-title" data-i18n="auth.sidePanelTitle">Everything in one place</h2>
            <ul class="auth-info-list">
                <li class="auth-info-item">
                    <span class="auth-info-check" aria-hidden="true">✓</span>
                    <span data-i18n="auth.sidePanelPoint1"></span>
                </li>
                <li class="auth-info-item">
                    <span class="auth-info-check" aria-hidden="true">✓</span>
                    <span data-i18n="auth.sidePanelPoint2"></span>
                </li>
                <li class="auth-info-item">
                    <span class="auth-info-check" aria-hidden="true">✓</span>
                    <span data-i18n="auth.sidePanelPoint3"></span>
                </li>
            </ul>
        </aside>
    </div>
</body>
</html>
