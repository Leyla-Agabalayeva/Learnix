<!DOCTYPE html>
<html lang="az">
<head>
    <script>(function(){try{var t=localStorage.getItem('lms.theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n-page-title="nav.dashboard">Dashboard — Learnix</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/pages/home.css">
    <link rel="stylesheet" href="/css/pages/student.css">
    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/student/dashboard.js"></script>
</head>
<body>
    <a class="skip-link" href="#main" data-i18n="nav.dashboard">Panel</a>
    <div id="navbar" data-active="dashboard"></div>

    <div class="container page">
        <div class="layout-with-sidebar">
            <!-- Меню кабинета собирается из js/components/student-sidebar.js -->
            <aside id="sidebar" data-active="dashboard"></aside>

            <main id="main">
                <header class="dashboard-greeting">
                    <h1 id="greeting">—</h1>
                    <p class="text-muted" data-i18n="student.welcomeHint"></p>
                </header>

                <!-- Главный блок: студент заходит, чтобы продолжить учиться -->
                <section id="continue-section" class="mb-8"></section>

                <section class="grid-stats mb-8" id="stats"></section>

                <section>
                    <div class="section-head">
                        <h2 class="section-title" data-i18n="student.myCoursesTitle">Kurslarım</h2>
                        <a class="btn btn-secondary btn-sm" href="/pages/student/my-courses.html"
                           data-i18n="actions.viewAll">Hamısına bax</a>
                    </div>
                    <div class="grid-cards" id="recent-courses"></div>
                </section>
            </main>
        </div>
    </div>
</body>
</html>
