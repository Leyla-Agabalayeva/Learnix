<!DOCTYPE html>
<html lang="az">
<head>
    <script>(function(){try{var t=localStorage.getItem('lms.theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n-page-title="nav.myCourses">My Courses — Learnix</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/pages/home.css">
    <link rel="stylesheet" href="/css/pages/student.css">
    <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/pages/student/my-courses.js"></script>
</head>
<body>
    <a class="skip-link" href="#main" data-i18n="nav.dashboard">Panel</a>
    <div id="navbar" data-active="my-courses"></div>

    <div class="container page">
        <div class="layout-with-sidebar">
            <!-- Меню кабинета собирается из js/components/student-sidebar.js -->
            <aside id="sidebar" data-active="my-courses"></aside>

            <main id="main">
                <header class="page-header">
                    <div>
                        <h1 class="page-title" data-i18n="student.myCoursesTitle">Mənim kurslarım</h1>
                        <p class="page-subtitle" data-i18n="student.myCoursesSubtitle"></p>
                    </div>
                </header>

                <div class="tabs" role="tablist" id="status-tabs">
                    <button class="tab is-active" type="button" role="tab" data-status=""
                            data-i18n="student.filterAll">Hamısı</button>
                    <button class="tab" type="button" role="tab" data-status="Active"
                            data-i18n="student.filterActive">Davam edir</button>
                    <button class="tab" type="button" role="tab" data-status="Completed"
                            data-i18n="student.filterCompleted">Bitmiş</button>
                </div>

                <div class="grid-cards" id="course-grid"></div>
            </main>
        </div>
    </div>
</body>
</html>
